name: Generate contribution snake

on:
  schedule:
    # Refresh twice daily so the animation stays close to the live graph.
    - cron: "17 */12 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

# The publisher must be able to update the output branch.
permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: true

jobs:
  generate:
    name: Build and publish snake
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate light and dark SVG animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: SakshamSinghal20
          outputs: |
            dist/github-snake.svg?palette=github-light
            dist/github-snake-dark.svg?palette=github-dark

      - name: Generate controlled contribution graph
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: SakshamSinghal20
          ACTIVITY_GRAPH_OUTPUT: dist/activity-graph.svg
        run: python3 scripts/generate_activity_graph.py

      - name: Publish generated assets to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          build_dir: dist
          target_branch: output
          commit_message: "chore: refresh contribution snake"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
